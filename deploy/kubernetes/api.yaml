apiVersion: apps/v1
kind: Deployment
metadata:
  name: risk-model-api
spec:
  replicas: 2
  selector:
    matchLabels: {app: risk-model-api}
  template:
    metadata:
      labels: {app: risk-model-api}
    spec:
      containers:
        - name: api
          image: REPLACE_WITH_YOUR_REGISTRY/risk-model-api:0.1.0
          ports: [{containerPort: 8000}]
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: '1', memory: 1Gi}
          readinessProbe:
            httpGet: {path: /readyz, port: 8000}
            initialDelaySeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: 8000}
            initialDelaySeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: risk-model-api
spec:
  selector: {app: risk-model-api}
  ports: [{port: 80, targetPort: 8000}]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: risk-model-api
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: risk-model-api}
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 70}
